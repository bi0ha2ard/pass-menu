[package]
name = "pass-menu"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pass-menu"
path = "src/pass-menu.rs"

[[bin]]
name = "ssh-menu"
path = "src/ssh-menu.rs"

[[bin]]
name = "man-menu"
path = "src/man-menu.rs"

[dependencies]
ab_glyph = "0.2.32"
frizbee = "0.13.0"
softbuffer = { version = "0.4.8", default-features = false }
thiserror = "2.0.21"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[features]
x11 = ["winit/x11", "softbuffer/x11"]
wayland = ["winit/wayland", "softbuffer/wayland", "winit/wayland-dlopen"]
